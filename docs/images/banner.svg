<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t">
  <title id="t">WebDep: your own private PaaS, on your own servers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset=".55" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#082032"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="290" y1="0" x2="720" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="860 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".08"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
    <path id="l1" d="M866 96C910 96 900 170 945 170"/>
    <path id="l2" d="M866 244C910 244 900 170 945 170"/>
    <path id="l3" d="M1045 170H1080"/>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .grid { animation: drift 9s linear infinite; }
    .glow { animation: breathe 5s ease-in-out infinite; transform-origin: 160px 170px; }
    .float { animation: float 5s ease-in-out infinite; }
    .late { animation-delay: -2.5s; }
    .mid { animation-delay: -1.2s; }
    .led { fill: #34d399; animation: blink 1.8s ease-in-out infinite; }
    .led.b { animation-delay: -.6s; }
    .led.c { animation-delay: -1.2s; }
    .wire { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 5 7; animation: flow 1.2s linear infinite; }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .r2 { animation-delay: .15s; }
    .r3 { animation-delay: .3s; }
    @keyframes drift { to { transform: translate(36px, 36px); } }
    @keyframes breathe { 50% { transform: scale(1.18); opacity: .65; } }
    @keyframes float { 50% { transform: translateY(-7px); } }
    @keyframes blink { 50% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .packet { display: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect class="grid" x="-36" y="-36" width="1272" height="412" fill="url(#grid)"/>
    <circle class="glow" cx="160" cy="170" r="190" fill="url(#glow)"/>

    <!-- logo mark -->
    <g class="float">
      <rect x="80" y="90" width="160" height="160" rx="36" fill="#0f172a" stroke="url(#blue)" stroke-width="3"/>
      <!-- the real mark from public/logo-mark.svg (144x144), scaled into the tile -->
      <g transform="translate(102.4 112.4) scale(0.8)">
        <defs>
          <linearGradient id="wd-blue" x1="10" y1="6" x2="72" y2="136" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/>
          </linearGradient>
          <linearGradient id="wd-cyan" x1="72" y1="6" x2="134" y2="136" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
          <clipPath id="wd-left"><rect x="0" y="0" width="72" height="144"/></clipPath>
          <clipPath id="wd-right"><rect x="72" y="0" width="72" height="144"/></clipPath>
          <clipPath id="wd-w-bounds"><rect x="0" y="70" width="144" height="74"/></clipPath>
          <mask id="wd-server-mask">
            <rect x="0" y="0" width="144" height="144" fill="#fff"/>
            <circle cx="55.5" cy="52" r="2.7" fill="#000"/>
            <rect x="75.5" y="50.6" width="15" height="2.8" rx="1.4" fill="#000"/>
            <circle cx="55.5" cy="70" r="2.7" fill="#000"/>
            <rect x="75.5" y="68.6" width="15" height="2.8" rx="1.4" fill="#000"/>
          </mask>
          <g id="wd-mark">
            <polygon points="72,4 13,60 25.5,60 72,16.5 118.5,60 131,60" fill="currentColor"/>
            <g mask="url(#wd-server-mask)" fill="currentColor">
              <rect x="47" y="46" width="50" height="12" rx="3"/>
              <rect x="47" y="64" width="50" height="12" rx="3"/>
            </g>
            <g clip-path="url(#wd-w-bounds)" fill="none" stroke="currentColor" stroke-linejoin="miter" stroke-miterlimit="6" stroke-linecap="butt">
              <rect x="7" y="70" width="29" height="8.5" rx="0.5" fill="currentColor" stroke="none"/>
              <rect x="108" y="70" width="29" height="8.5" rx="0.5" fill="currentColor" stroke="none"/>
              <polyline points="12,68 47,124 83,79 97,98 114,68" stroke-width="10"/>
              <polyline points="31,68 47,94 60,79 65,86" stroke-width="9"/>
              <polyline points="132,68 97,124 82,102" stroke-width="10"/>
            </g>
          </g>
        </defs>
        <use href="#wd-mark" clip-path="url(#wd-left)" style="color:#2f7df6"/>
        <use href="#wd-mark" clip-path="url(#wd-right)" style="color:#29d0f6"/>
        <circle class="led" cx="72" cy="131" r="6" style="fill:#10b981"/>
      </g>
    </g>

    <g>
      <text class="rise" x="290" y="152" font-size="76" font-weight="800" letter-spacing="-1" fill="url(#word)">WebDep</text>
      <text class="rise r2" x="293" y="196" font-size="23" font-weight="500" fill="#cbd5e1">Your own private PaaS, on your own servers.</text>
      <g class="rise r3" font-size="14" font-weight="600" fill="#bae6fd">
        <rect x="293" y="218" width="106" height="32" rx="16" fill="#0ea5e9" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/>
        <text x="346" y="239" text-anchor="middle">Websites</text>
        <rect x="409" y="218" width="106" height="32" rx="16" fill="#0ea5e9" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/>
        <text x="462" y="239" text-anchor="middle">Services</text>
        <rect x="525" y="218" width="108" height="32" rx="16" fill="#0ea5e9" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/>
        <text x="579" y="239" text-anchor="middle">PostgreSQL</text>
        <rect x="643" y="218" width="106" height="32" rx="16" fill="#0ea5e9" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/>
        <text x="696" y="239" text-anchor="middle">Multi-VPS</text>
      </g>
    </g>

    <!-- servers feeding one panel -->
    <use href="#l1" class="wire"/>
    <use href="#l2" class="wire"/>
    <use href="#l3" class="wire"/>
    <g class="packet" fill="#7dd3fc">
      <circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
    </g>

    <g fill="#111c33" stroke="#33507c" stroke-width="1.5">
      <g class="float mid"><rect x="776" y="66" width="90" height="60" rx="12"/></g>
      <g class="float late"><rect x="776" y="214" width="90" height="60" rx="12"/></g>
      <rect x="945" y="132" width="100" height="76" rx="14"/>
      <g class="float"><rect x="1080" y="140" width="70" height="60" rx="12"/></g>
    </g>
    <g class="float mid">
      <rect x="792" y="83" width="40" height="6" rx="3" fill="#475569"/><rect x="792" y="101" width="40" height="6" rx="3" fill="#475569"/>
      <circle class="led" cx="848" cy="86" r="4"/><circle class="led b" cx="848" cy="104" r="4"/>
    </g>
    <g class="float late">
      <rect x="792" y="231" width="40" height="6" rx="3" fill="#475569"/><rect x="792" y="249" width="40" height="6" rx="3" fill="#475569"/>
      <circle class="led c" cx="848" cy="234" r="4"/><circle class="led" cx="848" cy="252" r="4"/>
    </g>
    <rect x="960" y="147" width="70" height="8" rx="4" fill="url(#blue)"/>
    <rect x="960" y="163" width="32" height="30" rx="5" fill="#1e3a5f"/>
    <rect x="998" y="163" width="32" height="30" rx="5" fill="#1e3a5f"/>
    <g class="float" fill="none" stroke="#7dd3fc" stroke-width="2">
      <circle cx="1115" cy="170" r="17"/>
      <ellipse cx="1115" cy="170" rx="7" ry="17"/>
      <path d="M1098 170H1132"/>
    </g>
  </g>
</svg>
